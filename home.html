<!DOCTYPE html>
<head>
     <title>Navigation Menu Example</title>
    <style>
        /* CSS for styling the navigation menu */
        nav {
            
            background-color:blanchedalmond;
            color: rgb(160, 88, 148);
            padding: 10px;
        }
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }
        nav ul li {
            display: inline;
            margin-right: 20px;
        }
        nav ul li a {
            color:navy;
            text-decoration: none;
        }
        nav ul li a:hover {
            text-decoration: underline;
        }
        video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
             transform: translateX(-50%) translateY(-50%); 
        } 
        p{
            forced-color-adjust:navy;
        }
    </style>
</head>
